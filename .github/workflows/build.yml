name: Construir ISO não homologada (manual)
on:
  workflow_dispatch:
    inputs:
      modo:
        description: Construir ISO ou testar somente o boot da candidata existente.
        type: choice
        options:
          - construir
          - boot-live
        default: construir
      runner:
        description: Executor; self-hosted exige VM Ubuntu 24.04 x64 dedicada
        type: choice
        options:
          - ubuntu-24.04
          - self-hosted
        default: ubuntu-24.04
      confirmar_recursos:
        description: Conferi recursos; usar somente executor padrão gratuito ou VM própria existente.
        type: boolean
        required: true
        default: false
      otimizar_disco:
        description: Remover SDKs dispensáveis somente da VM efêmera GitHub-hosted.
        type: boolean
        default: true
      guardar_rascunho:
        description: Guardar partes em Release de rascunho não homologada; sem artefatos Actions.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fenix-build
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.confirmar_recursos && inputs.modo != 'boot-live' }}
    permissions:
      contents: write # Token exposto somente na etapa de rascunho; checkout sem credenciais persistidas.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "Linux", "X64", "fenix-noble"]') || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verificado
        with:
          persist-credentials: false
      - name: Liberar SDKs dispensáveis do runner hospedado
        if: ${{ inputs.runner == 'ubuntu-24.04' && inputs.otimizar_disco }}
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT ./tools/prepare-hosted-runner.sh
      - name: Conferir recursos antes de instalar dependências
        env:
          REPO_PUBLIC: ${{ !github.event.repository.private }}
        shell: bash
        run: |
          echo "Recursos antes do build:" >> "$GITHUB_STEP_SUMMARY"
          df -h . | tee -a "$GITHUB_STEP_SUMMARY"
          test "$REPO_PUBLIC" = true
          free -h
          test "$(df -Pk . | awk 'END {print int($4/1024/1024)}')" -ge 35
          test "$(awk '/MemTotal:/ {print int($2/1024)}' /proc/meminfo)" -ge 3800
      - name: Instalar ferramentas do host
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools gnupg curl rsync shellcheck desktop-file-utils python3-yaml qemu-system-x86 qemu-utils seabios
      - name: Validar fontes e ambiente
        run: |
          ./tools/lint.sh
          ./tools/preflight.sh
      - name: Construir
        run: sudo -E ./tools/build-iso.sh
      - name: Inspecionar e dividir (não homologa instalação)
        run: |
          sudo ./tools/test-iso.sh inspect
          sudo ./tools/package-release.sh
      - name: Registrar hashes nos logs e no resumo
        run: |
          cat dist/SHA256SUMS
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidato não homologado. Instalação e reboot NÃO EXECUTADOS neste job.' >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar candidata em Release de rascunho
        if: ${{ inputs.guardar_rascunho }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/store-candidate.sh
  boot-live:
    if: ${{ inputs.confirmar_recursos && inputs.modo == 'boot-live' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Conferir recursos e instalar QEMU oficial
        run: |
          test '${{ github.event.repository.private }}' = false
          df -h .
          test "$(df -Pk . | awk 'END {print int($4/1024/1024)}')" -ge 12
          test "$(awk '/MemTotal:/ {print int($2/1024)}' /proc/meminfo)" -ge 6000
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 seabios python3-pil
      - name: Reconstruir candidata e capturar boot real por dez minutos
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/test-live-ci.sh
      - name: Preservar evidências no rascunho sem artefatos Actions
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -d qa/boot-live && test -f dist/candidate-tag.txt; then
            name="boot-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
            tar -czf "$name" -C qa boot-live
            gh release upload "$(cat dist/candidate-tag.txt)" "$name" --repo Joescosame/F-NIX_OS
            echo 'Coleta terminada. Aprovação do boot depende da revisão das capturas.' >> "$GITHUB_STEP_SUMMARY"
          fi
