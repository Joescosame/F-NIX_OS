name: Validar fontes (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verificado
      - name: Dependências de validação
        run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils python3-yaml
      - name: Validar
        run: ./tools/lint.sh
