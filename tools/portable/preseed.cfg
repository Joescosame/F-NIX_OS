d-i debian-installer/locale string pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i time/zone string America/Sao_Paulo
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false
d-i tzsetup/geoip_server string
d-i netcfg/enable boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i partman-auto/disk string @DISK@
d-i partman-auto/method string regular
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/choose_recipe select fenix-portable
d-i partman-auto/expert_recipe string fenix-portable :: 2 2 2 free $iflabel{ gpt } method{ biosgrub } . 512 512 512 free $iflabel{ gpt } method{ efi } format{ } . 12000 20000 -1 ext4 method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false
d-i passwd/user-fullname string Teste FENIX
d-i passwd/username string fenixqa
d-i passwd/user-password-crypted password @PASSWORD_HASH@
d-i passwd/user-password password @PASSWORD@
d-i passwd/user-password-again password @PASSWORD@
d-i passwd/auto-login boolean true
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false
d-i grub-installer/bootdev string @DISK@
d-i grub-installer/only_debian boolean true
ubiquity ubiquity/download_updates boolean false
ubiquity ubiquity/use_nonfree boolean false
ubiquity ubiquity/reboot boolean false
ubiquity ubiquity/success_command string /bin/bash /opt/fenix-qa/guest-success.sh
